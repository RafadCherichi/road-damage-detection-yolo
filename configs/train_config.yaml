# Training hyperparameters for Ultralytics YOLOv8. Model/backbone spec lives
# in model_config.yaml, not here.
#
# Scope note: only the Focal Loss + augmentation values below were an actual
# decision made this session (Phase 2, docs/blueprint.md 2.1/2.2). Everything
# marked "provisional" is left at Ultralytics' own default/auto behavior on
# purpose — those are Phase 3/4 decisions (docs/blueprint.md) that haven't
# been presented/chosen yet, so this file doesn't silently lock them in.

data: configs/data.yaml

# --- Loss (Phase 2 Decision 2.1 — Class Imbalance) ---
# CORRECTION (this run's crash): fl_gamma is NOT a valid train() argument in
# the installed ultralytics==8.4.84 — verified directly in
# ultralytics/utils/loss.py: v8DetectionLoss now uses plain
# nn.BCEWithLogitsLoss for classification, no fl_gamma/FocalLoss wiring at
# all. Full writeup in docs/learning/07-focal-loss.md's correction section.
#
# DECISION: baseline run uses plain BCE as-is, no explicit class rebalancing
# (no key needed here for that — this is just Ultralytics' default
# behavior). Our imbalance is moderate (~2:1 D20:D10), not severe. If
# validation later shows D10 underperforming, the next thing to try is a
# `model.class_weights` training callback (real per-class weighting,
# genuine custom code) — not fl_gamma, which is gone, not renamed.

# --- Augmentation (Phase 2 Decision 2.2 — YOLO built-in, "Both" composed
# with the Albumentations weather pipeline in src/augmentation.py) ---
mosaic: 1.0        # Ultralytics default — keep on, diversity benefit still
                   # wanted per docs/learning/06-mosaic-mixup.md
mixup: 0.15        # RE-ENABLED, back to the original Decision 2.2 value.
                   # Was paused (0.0) after yolov8n_baseline-3 crashed
                   # partway through epoch 2 with a numpy ArrayMemoryError
                   # (CPU RAM, not VRAM) specifically during MixUp — YOLOv8
                   # chains Mosaic -> MixUp, so a MixUp event needs TWO full
                   # mosaic-composited images in memory at once, which was
                   # too sharp a spike for the local 8GB-RAM Windows laptop.
                   # That constraint doesn't apply on the current Colab T4
                   # session (far more system RAM), so "Both composed"
                   # (mosaic + mixup + Albumentations weather) is back in
                   # effect as originally decided.
close_mosaic: 10   # disable mosaic for the final 10 epochs so the model
                   # calibrates on true-scale objects before finishing
scale: 0.3         # reduced from Ultralytics' default 0.5. Our EDA bbox
                   # heatmap already showed small boxes, and mosaic
                   # independently halves normalized box size again (see the
                   # real India_000027 worked example in 06-mosaic-mixup.md)
                   # — a smaller scale-jitter range avoids compounding
                   # shrinkage into invisibility

# --- Provisional (Phase 3/4 — not decided today, using Ultralytics' own
# safe defaults so this file stays valid/runnable; revisit at the Phase 3/4
# decision gate) ---
epochs: 100        # provisional Ultralytics default — revisit at Phase 3/4 decision gate
optimizer: auto    # provisional Ultralytics default — revisit at Phase 3/4 decision gate
device: 0          # provisional Ultralytics default (first CUDA GPU) — revisit at Phase 3/4 decision gate

# --- Compute environment: Google Colab T4, 16GB VRAM (see CLAUDE.md
# CONSTRAINTS — training moved off the local 4GB VRAM / 8GB RAM laptop
# after the crash history below). Local-laptop values are kept in these
# comments as history, not deleted, since they explain *why* the project
# started this conservative and are still relevant if training ever moves
# back to a local/low-memory machine. ---
batch: 32          # was 4 (pinned conservatively on the local 4GB laptop,
                   # after an epoch-2 MixUp OOM crash at batch=8). 32 is a
                   # well-established safe value for yolov8n@640 on a 16GB
                   # T4 — comfortable headroom even with mosaic+mixup both
                   # active. Revisit -> -1 (AutoBatch) once this config has
                   # trained cleanly; AutoBatch's 60%-of-VRAM target is a
                   # very large, safe margin on 16GB, unlike on the 4GB card.
patience: 20       # default (100) equals epochs, making early stopping a no-op.
                   # 20 gives a real early-stopping safeguard: training stops if
                   # validation fitness hasn't improved in 20 epochs, saving GPU
                   # time and guarding against overfitting on this first run.
workers: 2         # was 0 (WinError 1455 workaround on the local Windows
                   # laptop: Windows multiprocessing uses spawn, so each
                   # worker process re-imports torch/CUDA from scratch,
                   # which exhausted the laptop's 8GB RAM). Colab's runtime
                   # is Linux, which uses fork — no whole-script re-import
                   # per worker — so that specific failure mode doesn't
                   # apply here. 2 gives a modest data-loading speedup with
                   # low risk; revisit upward only if loading proves to be
                   # a bottleneck relative to GPU compute time.
